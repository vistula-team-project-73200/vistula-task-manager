<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Task Manager</h1>
      <p>Student ID: <span id="student-id">73200</span></p>
    </header>

    <form id="task-form">
      <input type="hidden" id="task-id">
      <label for="task-title">Title</label>
      <input type="text" id="task-title" required placeholder="e.g. Learn Git">
      <label for="task-description">Description</label>
      <textarea id="task-description" rows="3" placeholder="Optional details"></textarea>
      <div class="form-actions">
        <button type="submit" id="task-submit">Add Task</button>
        <button type="button" id="task-cancel" hidden>Cancel</button>
      </div>
    </form>

    <p id="status-message" role="status" aria-live="polite"></p>

    <section id="task-list"></section>

    <footer>
      <a id="contribution-link" href="contribution.html">Team Contribution</a>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
